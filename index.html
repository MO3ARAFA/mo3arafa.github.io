<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04060C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>يومية التداول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#04060C;--sf:rgba(16,26,50,.52);--s2:rgba(90,135,255,.11);--ink:#EAF1FF;--mu:#8D9DC2;--ln:rgba(125,165,255,.17);--ac:#4C8DFF;--acf:#fff;--win:#20D69B;--loss:#FF5470;--warn:#F5B94A;--on:#04060C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{color-scheme:light;--bg:#E8EEFC;--sf:rgba(255,255,255,.66);--s2:rgba(40,90,220,.08);--ink:#0B1530;--mu:#5A6A8C;--ln:rgba(40,90,220,.16);--ac:#2563EB;--win:#0B8F68;--loss:#D12F4B;--warn:#B7791F;--on:#fff}
*{box-sizing:border-box}
html{background:var(--bg)}html,body{margin:0;color:var(--ink);font-family:"Readex Pro","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:12px 16px;border-bottom:1px solid var(--ln)}
.gs{display:flex;gap:10px;max-width:560px;margin:0 auto}
.g{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:8px 12px 8px 8px}
.g svg{flex:none;width:52px;height:52px}
.trk,.arc{fill:none;stroke-width:6}.trk{stroke:var(--s2)}.arc{stroke-linecap:round}
.arc.ok{stroke:var(--win)}.arc.warn{stroke:var(--warn)}.arc.bad{stroke:var(--loss)}
.pc{font-size:13px;font-weight:600;fill:var(--ink);direction:ltr}
.gt{display:flex;flex-direction:column;min-width:0}.gt span{font-size:11.5px;color:var(--mu);line-height:1.3}
.gt b{font-size:15px;font-weight:600;white-space:nowrap}.gt small{color:var(--mu);font-weight:400;font-size:11.5px}
.alert{max-width:560px;margin:10px auto 0;padding:9px 14px;border-radius:14px;background:var(--sf);border:1px solid var(--loss);color:var(--ink);font-size:14px;font-weight:500}
main{padding:18px 16px 124px;max-width:560px;margin:0 auto}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:18px;margin-bottom:14px}
h2{margin:0 0 14px;font-size:17px;font-weight:600}
label{display:block;font-size:12.5px;font-weight:500;color:var(--mu);margin-bottom:14px;flex:1}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--s2);border:1px solid transparent;border-radius:13px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input[type=file]{padding:10px;font-size:14px}
.row{display:flex;gap:10px}.row3{display:flex;gap:8px}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;padding:14px;font:inherit;font-weight:600;border:0;border-radius:15px;background:var(--s2);color:var(--mu)}
.seg button.on{color:var(--on)}.seg button.on.buy{background:var(--win)}.seg button.on.sell{background:var(--loss)}
button{font:inherit;cursor:pointer}
.primary{width:100%;padding:15px;border:0;border-radius:15px;background:var(--ac);color:var(--acf);font-weight:600;font-size:16px}
.row button{flex:1;padding:12px;border:0;border-radius:14px;background:var(--s2);color:var(--ink);font-weight:500}
nav{position:fixed;inset-inline:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin-inline:auto;display:flex;gap:2px;padding:6px;border-radius:26px;background:var(--sf);background:color-mix(in srgb,var(--sf) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--ln);box-shadow:0 12px 32px rgba(0,0,0,.22);z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border:0;border-radius:20px;background:none;color:var(--mu);font-size:11.5px;font-weight:500}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ac);background:var(--s2)}
.tr{border-inline-start:5px solid var(--win)}.tr.l{border-inline-start-color:var(--loss)}
.tr .h{display:flex;align-items:center;gap:10px}.tr .h b{font-size:17px;font-weight:600}
.tr .h .n{margin-inline-start:auto;font-size:22px;font-weight:700}
.tag{font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--s2)}
.tag.buy{color:var(--win)}.tag.sell{color:var(--loss)}
.win{color:var(--win)}.loss{color:var(--loss)}
.m{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0;font-size:13px;color:var(--mu)}
.tr p{margin:6px 0;font-size:15px}
.link{border:0;background:none;color:var(--loss);padding:6px 0;font-size:13px;font-weight:500}
.empty{text-align:center;color:var(--mu);padding:56px 24px;border:1px dashed var(--ln);border-radius:22px}
.hero{padding:20px 18px 0;overflow:hidden}.hero .lb{display:block;font-size:13px;color:var(--mu)}
.hero b{display:block;font-size:42px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.cv{display:block;width:calc(100% + 36px);margin:8px -18px 0;height:120px}
.zl{stroke:var(--ln);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.st{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px}
.st span{display:block;font-size:12.5px;color:var(--mu)}.st b{display:block;font-size:24px;font-weight:700;margin-top:2px}
.ms{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln)}.ms:last-child{border:0}
[hidden]{display:none!important}
.thumb{display:block;width:100%;max-height:120px;object-fit:cover;border-radius:14px;margin:8px 0;border:1px solid var(--ln)}
.thumb.big{max-height:none;object-fit:contain}.pre{margin-bottom:14px}
.mini{display:flex;gap:8px;margin:6px 0}.mini select{margin-top:0;font-size:14px;padding:8px 10px}
#toast{position:fixed;inset-inline:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:420px;margin-inline:auto;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:99px;text-align:center;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:7}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{aspect-ratio:1;border-radius:10px;background:var(--s2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;color:var(--mu);line-height:1.25;min-width:0}
.cd b{font-size:11px;font-weight:600;color:var(--ink)}
.cd.hd{aspect-ratio:auto;background:none;padding:2px 0}
.cd.w{background:color-mix(in srgb,var(--win) calc(var(--i)*1%),var(--s2))}
.cd.l{background:color-mix(in srgb,var(--loss) calc(var(--i)*1%),var(--s2))}
.cn{display:flex;align-items:center;gap:8px;margin-bottom:12px}.cn h2{margin:0;flex:1;font-size:16px}
.cn button{width:40px;height:40px;border:0;border-radius:13px;background:var(--s2);color:var(--ink);font-size:20px}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(40% 32% at 82% 8%,rgba(47,107,255,.42),transparent 70%),radial-gradient(38% 30% at 6% 48%,rgba(30,80,230,.30),transparent 70%),radial-gradient(34% 26% at 70% 95%,rgba(80,150,255,.22),transparent 70%);animation:dr 22s ease-in-out infinite alternate}
:root[data-theme="light"] body::before{opacity:.55}
@keyframes dr{to{transform:translate3d(-4%,3%,0) scale(1.08)}}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes pu{50%{box-shadow:0 0 0 14px rgba(76,141,255,0),0 0 46px rgba(76,141,255,.7)}}
.card,.g,.st,.empty{background:var(--sf);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 14px 34px -14px rgba(0,0,0,.65)}
#top{background:color-mix(in srgb,var(--bg) 52%,transparent)}
.primary{background:linear-gradient(135deg,#2F6BFF,#52A8FF);color:#fff;box-shadow:0 10px 26px -8px rgba(47,107,255,.8);transition:transform .15s}
.primary:active,.seg button:active,nav button:active{transform:scale(.96)}
nav{box-shadow:0 16px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1)}
nav button{transition:all .25s}
nav button.on{color:var(--ink);background:linear-gradient(135deg,rgba(60,120,255,.6),rgba(60,120,255,.16));box-shadow:0 0 22px rgba(60,120,255,.4)}
.hero b{text-shadow:0 0 36px color-mix(in srgb,currentColor 45%,transparent)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);box-shadow:0 0 0 5px rgba(76,141,255,.2)}
.dis{display:flex;align-items:center;gap:16px}.dis svg{flex:none;width:104px;height:104px}
.dis .sc{font-size:26px;font-weight:700;fill:var(--ink);direction:ltr}
.dis h2{margin:0 0 6px}.dis p{margin:2px 0;font-size:13px;color:var(--mu)}.dis p b{color:var(--ink);font-size:20px}
.wl{position:relative;overflow:hidden;text-align:center;padding:30px 20px;background:linear-gradient(160deg,rgba(47,107,255,.28),var(--sf) 70%)}
.orb{width:62px;height:62px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#BFD8FF,#3B7BFF 55%,#16348F);box-shadow:0 0 34px rgba(76,141,255,.6);animation:pu 3.2s ease-in-out infinite}
.wl h1{margin:0 0 8px;font-size:26px;font-weight:700;background:linear-gradient(90deg,var(--ink),#7FB0FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.wl p{margin:0 0 16px;color:var(--mu);font-size:14px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.chips span{font-size:12px;font-weight:500;padding:6px 12px;border-radius:99px;background:var(--s2);border:1px solid var(--ln)}
#v.in>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
#v.in>*:nth-child(2){animation-delay:.06s}#v.in>*:nth-child(3){animation-delay:.12s}#v.in>*:nth-child(4){animation-delay:.18s}#v.in>*:nth-child(n+5){animation-delay:.24s}
@media (prefers-reduced-motion:reduce){body::before,.orb,#v.in>*{animation:none}}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;color:var(--mu)}
.wk div{display:flex;flex-direction:column;align-items:center}.wk em{font-style:normal;margin-top:6px}
.wk .u,.wk .d{height:48px;width:100%;display:flex;justify-content:center}.wk .u{align-items:flex-end;border-bottom:1px solid var(--ln)}.wk .d{align-items:flex-start}
.wk i{display:block;width:56%;border-radius:6px;box-shadow:0 0 14px -2px currentColor}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mu);margin-inline-end:9px}.dot.on{background:var(--win);box-shadow:0 0 10px var(--win)}
.mt{background:linear-gradient(160deg,rgba(47,107,255,.2),var(--sf) 65%)}
#toast{z-index:30}#ob:empty{display:none}
#ob{position:fixed;inset:0;z-index:20;overflow:auto;background:radial-gradient(60% 38% at 50% 0%,rgba(47,107,255,.5),transparent 70%),radial-gradient(40% 30% at 90% 90%,rgba(60,130,255,.25),transparent 70%),var(--bg)}
.obw{min-height:100%;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto}
.obw .obs{align-self:flex-end;color:var(--mu);font-size:14px}
.obc{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;animation:up .5s both}
.obi{width:120px;height:120px;margin:0 auto 28px;border-radius:36px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(76,141,255,.38),rgba(76,141,255,.06));border:1px solid var(--ln);box-shadow:0 0 60px -6px rgba(76,141,255,.65),inset 0 1px 0 rgba(255,255,255,.15)}
.obi svg{width:54px;height:54px;fill:none;stroke:#BFD8FF;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(120,180,255,.8))}
.obc h1{margin:0 0 10px;font-size:28px;font-weight:700;background:linear-gradient(90deg,var(--ink),#7FB0FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.obc p{margin:0;color:var(--mu);font-size:15px;line-height:1.7}
.obf{text-align:start;margin-top:20px}
.obd{display:flex;gap:8px;justify-content:center;margin:20px 0}.obd i{width:8px;height:8px;border-radius:99px;background:var(--ln);transition:all .3s}.obd i.on{width:26px;background:var(--ac);box-shadow:0 0 12px var(--ac)}
</style>
</head>
<body>
<div id="top"></div>
<main id="v"></main>
<nav id="tabs"></nav>
<div id="toast"></div>
<div id="ob"></div>
<script>
const K='tj1',$=s=>document.querySelector(s);
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S&&S.trades?S:{trades:[],rules:{size:10000,daily:5,dd:10}};
const DS={th:'auto',pair:'XAUUSD',warn:80,maxT:0,off:0,tags:''},fix=()=>{S.set=Object.assign({},DS,S.set||{})};fix();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){return false}};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date(Date.now()+(S.set.off||0)*36e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const f=(n,d=2)=>Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const sg=n=>(n>0?'+':'')+f(n);
const TABS=[['add','تسجيل'],['list','الصفقات'],['stats','الإحصائيات'],['rules','القواعد'],['set','الإعدادات']];
const MIS=['بدون خطأ','دخول بدري','ما احترمتش الستوب','زودت اللوت','صفقة انتقام','ضد الاتجاه','خروج بدري'];
const MOOD=['هادي','متوتر','طماع','خايف','غضبان'];
let tab='add',dir='buy',pd=null,ps='win',eid=null;
function sp(k){ps=k;$('#q1').className=k=='win'?'on buy':'';$('#q2').className=k=='loss'?'on sell':''}
function calcR(d,en,ex,sl){if(en==null||ex==null||sl==null)return null;const risk=d=='buy'?en-sl:sl-en;if(risk<=0)return null;return(d=='buy'?ex-en:en-ex)/risk}
function toast(m){const t=$('#toast');t.textContent=tx(m);t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function gauge(l,u,lim){const p=lim>0?Math.min(100,u/lim*100):0,c=p>=85?'bad':p>=60?'warn':'ok',C=2*Math.PI*22;
return`<div class="g"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="22" class="trk"/><circle cx="28" cy="28" r="22" class="arc ${c}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}" transform="rotate(-90 28 28)"/><text x="28" y="32" text-anchor="middle" class="pc">${Math.round(p)}%</text></svg><div class="gt"><span>${l}</span><b class="n">${f(u)}<small> / ${f(lim)}$</small></b></div></div>`}
function renderTop(){const r=S.rules,t=today();
const td=S.trades.filter(x=>x.date==t).reduce((a,x)=>a+x.pnl,0),tot=S.trades.reduce((a,x)=>a+x.pnl,0);
const dl=r.size*r.daily/100,ml=r.size*r.dd/100,du=Math.max(0,-td),mu=Math.max(0,-tot);
const dp=dl>0?du/dl:0,mp=ml>0?mu/ml:0;
const msg=(dp>=1||mp>=1)?'وصلت للحد. وقّف التداول النهارده.':(dp>=S.set.warn/100||mp>=S.set.warn/100)?'قربت من الحد. فكّر قبل أي صفقة جديدة.':'';
$('#top').innerHTML='<div class="gs">'+gauge('خسارة النهارده',du,dl)+gauge('الـ drawdown الكلي',mu,ml)+'</div>'+(msg?`<p class="alert">${msg}</p>`:'')+(S.set.maxT>0&&S.trades.filter(x=>x.date==t).length>=S.set.maxT?'<p class="alert">وصلت للحد الأقصى لعدد الصفقات النهارده.</p>':'')}
const IC={add:'<path d="M12 5v14M5 12h14"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',stats:'<path d="M5 20V11M12 20V4M19 20v-6"/>',rules:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',set:'<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/>'};
function nav(){$('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${IC[k]}</svg><span>${l}</span></button>`).join('')}
function go(t){tab=t;eid=null;pd=null;cw=false;render();scrollTo(0,0)}
function sd(d){dir=d;$('#b1').className=d=='buy'?'on buy':'';$('#b2').className=d=='sell'?'on sell':''}
const opts=a=>a.map(x=>`<option value="${x}">${x}</option>`).join('');
const num=(id,l)=>`<label>${l}<input id="${id}" type="number" step="any" inputmode="decimal"></label>`;
function vAdd(){return(S.trades.length?'':WL)+vMT()+`<section class="card"><h2 id="fh">صفقة جديدة</h2>
<div class="row"><label>التاريخ<input id="d" type="date" value="${today()}"></label>
<label>الزوج<input id="p" list="pl" value="${esc(S.set.pair)}"><datalist id="pl"><option>XAUUSD</option><option>EURUSD</option><option>GBPUSD</option><option>USDJPY</option><option>BTCUSDT</option><option>ETHUSDT</option></datalist></label></div>
<div class="seg"><button id="b1" class="${dir=='buy'?'on buy':''}" onclick="sd('buy')">شراء</button><button id="b2" class="${dir=='sell'?'on sell':''}" onclick="sd('sell')">بيع</button></div>
<div class="row3">${num('en','دخول')}${num('sl','ستوب')}${num('ex','خروج')}</div>
<div class="seg"><button id="q1" class="${ps=='win'?'on buy':''}" onclick="sp('win')">ربح</button><button id="q2" class="${ps=='loss'?'on sell':''}" onclick="sp('loss')">خسارة</button></div>${num('pn','النتيجة بالدولار')}
<div class="row"><label>حالتك النفسية<select id="mo">${opts(MOOD)}</select></label><label>الخطأ<select id="mi">${opts(ML())}</select></label></div>
<label>سبب الدخول وملاحظات<textarea id="nt" rows="2"></textarea></label>
<label>سكرين شوت (اختياري)<input id="sh" type="file" accept="image/*" onchange="pick(this)"></label><img id="pv" class="thumb pre" alt="" hidden>
<button id="sv" class="primary" onclick="addT()">حفظ الصفقة</button></section>`}
function addT(){const g=i=>$('#'+i).value,n=i=>g(i)===''?null:parseFloat(g(i));
let pnl=n('pn');if(pnl>0&&ps=='loss')pnl=-pnl;if(pnl===null||isNaN(pnl)||!g('p').trim()){toast('اكتب الزوج والنتيجة بالدولار');return}
const en=n('en'),ex=n('ex'),sl=n('sl');
const o={date:g('d')||today(),pair:g('p').trim().toUpperCase(),dir,en,ex,sl,pnl,r:calcR(dir,en,ex,sl),mood:g('mo'),mis:g('mi'),note:g('nt').trim(),img:shot},t=eid?S.trades.find(x=>x.id==eid):null,old=t?{...t}:null;
if(t)Object.assign(t,o);else S.trades.push({id:Date.now(),...o});
if(!save()){if(t)Object.assign(t,old);else S.trades.pop();toast('المساحة امتلأت. صدّر نسخة واحذف صور قديمة');return}
